# Runs a Pulumi command with its output held back and scanned for key, certificate and token
# material. A hit fails the step and withholds the output. The Pulumi CLI must already be
# installed (pulumi/actions without `command`); passphrase and backend credentials are
# inherited from the caller's environment, never passed as inputs.
# The scan catches armoured and well-known token shapes; it cannot catch unarmoured secrets,
# so mark credential values as Pulumi secrets too. Before running, every argument token is
# scanned: --show-secrets, config followed later by get, and env/esc followed later by
# open/get/run are refused. Options are not parsed, so all other invocations pass through.
name: Pulumi guarded
description: Runs a Pulumi command and withholds its output when it carries key, certificate or token material.

inputs:
  command:
    description: Single Pulumi command token; config followed later by get, and env/esc followed later by open/get/run, are refused anywhere in the arguments.
    required: true
  stack-name:
    description: Stack passed as --stack; omitted when empty.
    required: false
    default: ""
  work-dir:
    description: Directory containing the Pulumi project.
    required: false
    default: .
  args:
    description: Extra Pulumi arguments, space-separated; --show-secrets and its equals form are refused anywhere, and literal command words are scanned even after --.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run pulumi ${{ inputs.command }} (guarded)
      shell: bash
      working-directory: ${{ inputs.work-dir }}
      env:
        PULUMI_GUARD_COMMAND: ${{ inputs.command }}
        PULUMI_GUARD_STACK: ${{ inputs.stack-name }}
        PULUMI_GUARD_ARGS: ${{ inputs.args }}
        PULUMI_GUARD_SCRIPT: ${{ github.action_path }}/../../scripts/pulumi-guarded.sh
      run: |
        set -euo pipefail
        args=("$PULUMI_GUARD_COMMAND")
        if [ -n "$PULUMI_GUARD_STACK" ]; then
          args+=(--stack "$PULUMI_GUARD_STACK")
        fi
        if [ "$PULUMI_GUARD_COMMAND" = up ]; then
          args+=(--yes --skip-preview --non-interactive)
        fi
        if [ -n "$PULUMI_GUARD_ARGS" ]; then
          read -r -a extra <<< "$PULUMI_GUARD_ARGS"
          args+=("${extra[@]}")
        fi
        bash "$PULUMI_GUARD_SCRIPT" "${args[@]}"
