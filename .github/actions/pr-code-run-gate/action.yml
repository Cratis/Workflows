name: Cratis pull request code-run gate
description: >-
  For the label and edit events of a pull request, whose own run builds nothing: waits for the
  code run (opened, synchronize, reopened, ready_for_review) of the same head commit and fails
  unless it succeeded, so the gate never reports green for a commit that was not built. The
  caller ends the `run-name` of every pull request run with a marker it controls (`[code]` for
  code runs, `[meta]` for label/edit runs) and only runs ending in the code marker are awaited, so
  a pull request title cannot pose as a code run or hide one. Needs `actions: read` on the calling job.

inputs:
  head-sha:
    description: Head commit of the pull request.
    required: true
  workflow-file:
    description: File name of the pull request workflow whose code run is awaited.
    required: false
    default: pull-requests.yml
  code-marker:
    description: Suffix the caller adds to the run name of code runs.
    required: false
    default: "[code]"
  timeout-seconds:
    description: How long to wait for the code run to finish.
    required: false
    default: "5400"
  poll-seconds:
    description: Seconds between checks.
    required: false
    default: "30"
  token:
    description: Token with actions read access.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Wait for the code run of this commit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        CODE_MARKER: ${{ inputs.code-marker }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        POLL_SECONDS: ${{ inputs.poll-seconds }}
      run: bash "${{ github.action_path }}/wait-for-code-run.sh"
