name: Cratis Yarn cache
description: >-
  Restores the Yarn package cache (never node_modules, never yarn.lock) under one key and
  one path list for every workflow in a repository. Pull requests only restore; the cache
  is saved only from push to the default branch, schedule, or workflow_dispatch on the
  default branch.

inputs:
  working-directory:
    description: Directory holding yarn.lock and .yarnrc.yml, relative to the workspace.
    required: false
    default: .
  path:
    description: Newline-separated paths to cache. Empty means the folder `yarn config get cacheFolder` reports in the working directory (Yarn must be on PATH, for example after setup-node and corepack enable), falling back to <working-directory>/.yarn/cache. Keep it identical everywhere; a different path list is a different cache.
    required: false
    default: ""
  key-prefix:
    description: Key prefix; bump the version suffix to start a fresh cache.
    required: false
    default: yarn-v1
  mode:
    description: "auto (save only on the default branch, schedule or workflow_dispatch on the default branch), restore (never save) or save (always save-capable)."
    required: false
    default: auto

outputs:
  cache-hit:
    description: "'true' when the exact key was restored, otherwise 'false'."
    value: ${{ steps.restore.outputs.cache-hit == 'true' }}
  matched-key:
    description: The key that was restored, exact or a restore-key prefix match; empty on a miss.
    value: ${{ steps.restore.outputs.cache-matched-key }}
  key:
    description: The primary cache key.
    value: ${{ steps.resolve.outputs.key }}
  mode:
    description: The resolved mode, restore or save.
    value: ${{ steps.resolve.outputs.mode }}

runs:
  using: composite
  steps:
    - name: Resolve cache mode and key
      id: resolve
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PATH: ${{ inputs.path }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CACHE_KEY_PREFIX: ${{ inputs.key-prefix }}-${{ runner.os }}-
        CACHE_KEY_HASH: ${{ hashFiles(format('{0}/yarn.lock', inputs.working-directory), format('{0}/.yarnrc.yml', inputs.working-directory)) }}
        EVENT_NAME: ${{ github.event_name }}
        GIT_REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        case "$INPUT_MODE" in
          restore|save) mode="$INPUT_MODE" ;;
          auto)
            mode=restore
            if [ "$EVENT_NAME" = schedule ]; then
              mode=save
            elif [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
              if [ -n "$DEFAULT_BRANCH" ] && [ "$GIT_REF" = "refs/heads/${DEFAULT_BRANCH}" ]; then
                mode=save
              fi
            fi
            ;;
          *)
            echo "::error title=yarn-cache::mode must be auto, restore or save; got '${INPUT_MODE}'"
            exit 2
            ;;
        esac
        working_directory="${WORKING_DIRECTORY%/}"
        working_directory="${working_directory:-.}"
        if [ ! -f "${working_directory}/yarn.lock" ]; then
          echo "::error title=yarn-cache::No yarn.lock in '${WORKING_DIRECTORY}'; refusing to cache without a lockfile key"
          exit 2
        fi
        if [ -z "$CACHE_KEY_HASH" ]; then
          echo "::error title=yarn-cache::hashFiles matched no lockfile under '${WORKING_DIRECTORY}'; use a workspace-relative working-directory"
          exit 2
        fi
        # Yarn 4 keeps a global cache unless enableGlobalCache is false, so ask Yarn
        # where its cache is before assuming the project-local folder.
        detect_cache_folder() {
          command -v yarn >/dev/null 2>&1 || return 1
          local folder
          folder="$(cd "$working_directory" && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 yarn config get cacheFolder 2>/dev/null)" || return 1
          folder="${folder%$'\r'}"
          case "$folder" in
            ""|undefined|*$'\n'*) return 1 ;;
          esac
          printf '%s' "$folder"
        }
        cache_path="$INPUT_PATH"
        if [ -z "$cache_path" ]; then
          if cache_path="$(detect_cache_folder)"; then
            echo "yarn-cache: using the cacheFolder Yarn reports: ${cache_path}"
          else
            if [ "$working_directory" = "." ]; then
              cache_path=".yarn/cache"
            else
              cache_path="${working_directory}/.yarn/cache"
            fi
            echo "yarn-cache: Yarn did not report a cacheFolder; using ${cache_path}"
          fi
        fi
        delimiter="path-$RANDOM-$RANDOM-$RANDOM"
        {
          echo "mode=${mode}"
          echo "restore-key=${CACHE_KEY_PREFIX}"
          echo "key=${CACHE_KEY_PREFIX}${CACHE_KEY_HASH}"
          echo "path<<${delimiter}"
          printf '%s\n' "$cache_path"
          echo "${delimiter}"
        } >> "$GITHUB_OUTPUT"
        echo "yarn-cache: mode=${mode} key=${CACHE_KEY_PREFIX}${CACHE_KEY_HASH}"

    - name: Restore Yarn cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.path }}
        key: ${{ steps.resolve.outputs.key }}
        restore-keys: ${{ steps.resolve.outputs.restore-key }}

    # Registers the post-job save without downloading again. actions/cache skips the
    # save when the exact key already exists.
    - name: Save Yarn cache at the end of the job
      if: steps.resolve.outputs.mode == 'save'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.path }}
        key: ${{ steps.resolve.outputs.key }}
        lookup-only: true
