name: Cratis .NET package cache
description: >-
  Restores the NuGet package cache under one key and one path list for every workflow
  in a repository. Pull requests only restore; the cache is saved only from push to the
  default branch, schedule, or workflow_dispatch on the default branch.

inputs:
  path:
    description: Newline-separated paths to cache. Keep it identical everywhere; a different path list is a different cache.
    required: false
    default: ~/.nuget/packages
  exclude:
    description: >-
      Opt-in, newline-separated glob patterns to leave out of the cache, for example
      ~/.nuget/packages/**/*.nupkg. Each is appended to the path list as a negated (!) pattern, so
      the same list is used by restore and save. Blank lines are ignored and a leading ! is
      optional. Empty (default) changes nothing. A different path list is a different cache.
    required: false
    default: ""
  key-files:
    description: Newline-separated hashFiles patterns the cache key is computed from.
    required: false
    default: |
      **/packages.lock.json
      **/*.props
      **/*.targets
      **/*.csproj
      **/[Nn]u[Gg]et.[Cc]onfig
      *.slnx
      global.json
  key-prefix:
    description: Key prefix; bump the version suffix to start a fresh cache.
    required: false
    default: nuget-v1
  mode:
    description: "auto (save only on the default branch, schedule or workflow_dispatch on the default branch), restore (never save) or save (always save-capable)."
    required: false
    default: auto
  prune-on-miss:
    description: >-
      Opt-in ('true' or 'false'). On an exact-key miss in save mode the restore-keys prefix
      restores an older cache and the post-save would store old plus new, so stale package
      versions accumulate. When 'true' the contents of the default ~/.nuget/packages folder are
      emptied after the restore, so the job's own restore/build repopulates it and the saved cache
      holds only current versions. Only for jobs that run a full restore/build of everything the
      cache must contain; leave narrow jobs on the default and give them mode restore. Never runs
      on a hit, in restore mode, or with a custom path.
    required: false
    default: "false"

outputs:
  cache-hit:
    description: "'true' when the exact key was restored, otherwise 'false'."
    value: ${{ steps.restore.outputs.cache-hit == 'true' }}
  matched-key:
    description: The key that was restored, exact or a restore-key prefix match; empty on a miss.
    value: ${{ steps.restore.outputs.cache-matched-key }}
  key:
    description: The primary cache key.
    value: ${{ steps.resolve.outputs.key }}
  mode:
    description: The resolved mode, restore or save.
    value: ${{ steps.resolve.outputs.mode }}

runs:
  using: composite
  steps:
    - name: Resolve cache mode and key
      id: resolve
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        CACHE_KEY_PREFIX: ${{ inputs.key-prefix }}-${{ runner.os }}-
        CACHE_KEY_HASH: ${{ hashFiles(inputs.key-files) }}
        EVENT_NAME: ${{ github.event_name }}
        GIT_REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        case "$INPUT_MODE" in
          restore|save) mode="$INPUT_MODE" ;;
          auto)
            mode=restore
            if [ "$EVENT_NAME" = schedule ]; then
              mode=save
            elif [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
              if [ -n "$DEFAULT_BRANCH" ] && [ "$GIT_REF" = "refs/heads/${DEFAULT_BRANCH}" ]; then
                mode=save
              fi
            fi
            ;;
          *)
            echo "::error title=dotnet-cache::mode must be auto, restore or save; got '${INPUT_MODE}'"
            exit 2
            ;;
        esac
        if [ -z "$CACHE_KEY_HASH" ]; then
          echo "::error title=dotnet-cache::No file matched key-files; refusing to cache under a key without a content hash"
          exit 2
        fi
        delimiter="path-$RANDOM-$RANDOM-$RANDOM"
        {
          echo "mode=${mode}"
          echo "restore-key=${CACHE_KEY_PREFIX}"
          echo "key=${CACHE_KEY_PREFIX}${CACHE_KEY_HASH}"
          echo "path<<${delimiter}"
          printf '%s\n' "$INPUT_PATH"
          # actions/glob strips each leading ! (toggling negation) before it expands ~, so !~/... works.
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            pattern="${pattern#"${pattern%%[![:space:]]*}"}"
            pattern="${pattern%"${pattern##*[![:space:]]}"}"
            while [ "${pattern#!}" != "$pattern" ]; do
              pattern="${pattern#!}"
              pattern="${pattern#"${pattern%%[![:space:]]*}"}"
            done
            if [ -n "$pattern" ]; then
              printf '!%s\n' "$pattern"
            fi
          done <<< "$INPUT_EXCLUDE"
          echo "${delimiter}"
        } >> "$GITHUB_OUTPUT"
        echo "dotnet-cache: mode=${mode} key=${CACHE_KEY_PREFIX}${CACHE_KEY_HASH}"

    - name: Restore NuGet packages
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.path }}
        key: ${{ steps.resolve.outputs.key }}
        restore-keys: ${{ steps.resolve.outputs.restore-key }}

    - name: Prune stale NuGet packages on a cache miss
      if: inputs.prune-on-miss == 'true' && steps.resolve.outputs.mode == 'save' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        if [ "$INPUT_PATH" != "~/.nuget/packages" ]; then
          echo "::notice title=dotnet-cache::prune-on-miss supports only the default ~/.nuget/packages path; nothing pruned"
          exit 0
        fi
        dir="${NUGET_PACKAGES:-$HOME/.nuget/packages}"
        dir="${dir//$'\r'/}"
        while [ "${dir%/}" != "$dir" ] && [ -n "${dir%/}" ]; do
          dir="${dir%/}"
        done
        if [ "$dir" != "$HOME/.nuget/packages" ] || [ -L "$dir" ] || [ ! -d "$dir" ]; then
          echo "::notice title=dotnet-cache::prune-on-miss skipped; the global-packages folder is not an existing real \$HOME/.nuget/packages directory; nothing pruned"
          exit 0
        fi
        count="$(find "$dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
        find "$dir" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        echo "dotnet-cache: pruned ${count} entries from ${dir} after an exact-key miss"

    # Registers the post-job save without downloading again. actions/cache skips the
    # save when the exact key already exists.
    - name: Save NuGet packages at the end of the job
      if: steps.resolve.outputs.mode == 'save'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.path }}
        key: ${{ steps.resolve.outputs.key }}
        lookup-only: true
