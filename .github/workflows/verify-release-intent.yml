name: Verify Release Intent

# The organization-wide release-intent gate, called from every repository's thin
# verify workflow. A merged pull request with no major/minor/patch label produces a
# Publish run that reports success while skipping every publish step; requiring the
# label turns a silent non-release into a visible failure before the merge.
#
# `no-release` is the fourth accepted answer, and it is a decision rather than an
# omission: the pull request changes nothing a consumer compiles against or runs, so
# there is nothing to version. The policy is maintained with the Cratis AI
# engineering guidance (github.com/Cratis/AI).
#
# This lives here because 30+ per-repository copies of this logic drifted apart, and
# on 2026-08-25 the repositories whose copies predated `no-release` forced
# configuration-only pull requests to carry `patch` - cutting four unintended
# releases. Policy changes to the gate are now one pull request, here.

#
# Dependabot pull requests carry only `no-release`: release-action never releases
# them, and the major/minor/patch label Dependabot adds on its own describes the
# dependency's version bump, not this product's. normalize-dependabot-labels.yml
# corrects the labels before this gate runs in the same caller.
#
# The labels are read from the pull request as it is now, not from the event
# payload: "Re-run" replays the event that started the run, so a payload read
# keeps failing on the labels of that moment. If the read fails (a caller that does
# not grant `pull-requests: read`), the payload is used.

on:
  workflow_call: {}

# No `permissions` key on purpose: a called workflow can only narrow what its caller grants, so a cap here would take
# away the `pull-requests: read` the live read needs, and asking for more than a caller grants fails the run before it
# starts. The canonical caller grants `contents: read` and `pull-requests: read`.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require exactly one release-intent label
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          LABELS="$EVENT_LABELS"
          AUTHOR="$EVENT_AUTHOR"
          if [ -n "$NUMBER" ] && pull=$(gh api "repos/$REPOSITORY/pulls/$NUMBER" 2>/dev/null) \
            && live_labels=$(printf '%s' "$pull" | jq -ce '[.labels[].name]' 2>/dev/null); then
            LABELS="$live_labels"
            AUTHOR=$(printf '%s' "$pull" | jq -r '.user.login // empty')
          else
            echo "::notice title=Release intent read from the event::Could not read the pull request as it is now; using the labels of the event that started this run. Grant the caller pull-requests: read."
          fi
          echo "Labels: $LABELS"

          version=$(printf '%s' "$LABELS" | jq '[.[] | select(. == "major" or . == "minor" or . == "patch")] | length')
          none=$(printf '%s' "$LABELS" | jq '[.[] | select(. == "no-release")] | length')
          count=$((version + none))

          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            if [ "$version" -eq 0 ] && [ "$none" -eq 1 ]; then
              echo "Dependabot pull request labelled no-release only."
              exit 0
            fi
            echo "::error::Dependabot pull requests carry only no-release, with none of major, minor or patch. Dependabot applies major/minor/patch from the dependency's own version; release-action never releases Dependabot PRs. Remove major, minor and patch and add no-release; the normalize-dependabot-labels job in verify-semver-label.yml does this automatically."
            exit 1
          fi

          if [ "$count" -eq 1 ]; then
            if [ "$none" -eq 1 ]; then
              echo "Labelled no-release: merging this pull request publishes nothing, by decision."
            else
              echo "Found one semantic version label."
            fi
            exit 0
          fi

          if [ "$count" -eq 0 ]; then
            echo "::error::This pull request states no release intent. Add exactly one of major, minor or patch to publish a release, or no-release if it changes nothing a consumer compiles against or runs - documentation, CI, tooling and spec-only changes. Without any of them, merging produces a Publish run that skips every publish step, so nothing is released and nothing says that was intended."
          elif [ "$version" -ge 1 ] && [ "$none" -eq 1 ]; then
            echo "::error::This pull request is labelled no-release as well as a semantic version. It either ships something or it does not - remove whichever is wrong."
          else
            echo "::error::This pull request carries $version semantic version labels. Exactly one of major, minor or patch is required, since the release version cannot be derived from more than one."
          fi

          exit 1
