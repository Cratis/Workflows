name: Trigger Documentation Build

# Reusable dispatcher for the documentation site. A dozen repositories previously
# carried identical copies of this dispatch; the copies are now thin callers so the
# target repository or event type changes in exactly one place.

on:
  workflow_call:
    inputs:
      repository:
        description: Repository that builds the documentation site.
        type: string
        required: false
        default: Cratis/Documentation
      event-type:
        description: repository_dispatch event type the target listens for.
        type: string
        required: false
        default: build-docs
    secrets:
      PAT_DOCUMENTATION:
        required: true

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger documentation build
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.PAT_DOCUMENTATION }}
          repository: ${{ inputs.repository }}
          event-type: ${{ inputs.event-type }}
