name: Propagate Copilot Instructions

# Compatibility endpoint for existing callers. Legacy cross-repository broadcast
# is retired: a source-repository push must not overwrite another checkout's
# instructions, private overlays, or generated host adapters.
# Keep the call interface while consuming repositories migrate to reviewed,
# immutable AI distribution. Normal verification workflows remain unchanged.
on:
  workflow_call:
    inputs:
      event_name:
        description: 'Legacy caller event; retained for compatibility only.'
        required: false
        type: string
        default: 'push'
    secrets:
      PAT_WORKFLOWS:
        description: 'Legacy credential; no longer required or used.'
        required: false

permissions:
  contents: read

jobs:
  retired:
    name: Legacy propagation is disabled
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain retired behavior
        run: |
          printf '%s\n' \
            'Legacy cross-repository AI propagation is disabled.' \
            'No repositories, files, branches, or issues were changed.' \
            'Use reviewed immutable distribution updates instead.'
