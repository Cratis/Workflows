name: Verify Work Record Guard

on:
  pull_request:
    paths:
      - .github/workflows/verify-no-work-records.yml
      - .github/workflows/verify-work-record-guard.yml
      - .github/scripts/tests/verify-no-work-records.test.py
      - README.md
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-no-work-records.yml
      - .github/workflows/verify-work-record-guard.yml
      - .github/scripts/tests/verify-no-work-records.test.py
      - README.md

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out workflow and offline tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise the actual inline guard program
        # Fixture repositories only; no GitHub contact. Includes the program's --self-test.
        run: python3 .github/scripts/tests/verify-no-work-records.test.py
