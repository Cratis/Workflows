name: Update Packages
# Reusable workflow that updates NuGet, NPM, Gradle (Kotlin/JVM), and/or Mix
# (Elixir) packages in the calling repository, builds to verify nothing is
# broken, and by default pushes directly to the default branch. Opt-in
# pull-request publication validates one candidate without rebasing; see README.
#
# PAT_WORKFLOWS permissions:
#   Classic PAT:       repo scope
#   Fine-grained PAT:  Contents (read/write) + Metadata (read)
#   Pull-request mode additionally needs Pull requests (read/write).
#
# Direct mode requires a bypass actor where default-branch protection prevents
# direct pushes. Pull-request mode needs permission to create its run-owned
# branch and PR, not default-branch bypass; it never merges.
#
# Callers should declare the secret as
#   PAT_WORKFLOWS: ${{ secrets.PAT_WORKFLOWS || github.token }}
# so that repositories where the organization secret is not available
# (private repositories on plans without organization-level secret
# support) fall back to the workflow's own GITHUB_TOKEN. This workflow
# deliberately declares no permissions block, preserving caller inheritance.
# GITHUB_TOKEN callers need contents: write, and pull-requests: write for PR
# mode; the reusable workflow cannot elevate its caller's token permissions.
# PAT-based pushes are not affected by GITHUB_TOKEN permissions. See README
# for PR-creation policy and downstream event/CI differences between tokens.

env:
  DOTNET_VERSION: "10.0.x"
  JAVA_VERSION: "21"
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27"

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label the update job runs on. Callers in private repositories
          should pass their self-hosted scale-set label (for example cratis-arc)
          so the daily update does not consume billed GitHub-hosted minutes.
        type: string
        required: false
        default: ubuntu-latest
      npm-package-exclusions:
        description: >-
          Comma-delimited packages that npm-check-updates must leave unchanged.
          TypeScript remains excluded by default until Yarn supports its 7.x layout.
        type: string
        required: false
        default: typescript
      post-update-command:
        description: >-
          Optional trusted Bash command in the caller repository root, after all
          updates and before all builds. Failure stops publication in either mode.
        type: string
        required: false
        default: ''
      publication-mode:
        description: >-
          direct preserves legacy publication; pull-request publishes only the
          exact validated candidate on a unique run-owned branch, without rebasing.
        type: string
        required: false
        default: direct
      pull-request-label:
        description: >-
          Optional single existing label for pull-request mode. No release intent
          is inferred. Use letters, digits, dot, underscore, colon, slash or hyphen.
        type: string
        required: false
        default: ''
    secrets:
      PAT_WORKFLOWS:
        required: false

jobs:
  update-packages:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Callers pass PAT_WORKFLOWS where the organization secret is
          # available. Private repositories on plans without organization-level
          # secret support cannot resolve it (it evaluates to an empty string),
          # so fall back to the workflow's own GITHUB_TOKEN there.
          token: ${{ secrets.PAT_WORKFLOWS || github.token }}
          fetch-depth: 0

      - name: Check publication options and default-branch base
        id: publication
        shell: bash
        env:
          PUBLICATION_MODE: ${{ inputs.publication-mode }}
          PR_LABEL: ${{ inputs.pull-request-label }}
          GH_TOKEN: ${{ secrets.PAT_WORKFLOWS || github.token }}
          CALLER_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$PUBLICATION_MODE" in
            direct)
              test -z "$PR_LABEL" || { echo "Labels require pull-request mode" >&2; exit 1; }
              exit 0 ;;
            pull-request) ;;
            *) echo "Invalid publication-mode" >&2; exit 1 ;;
          esac
          export LC_ALL=C
          if [[ -n "$PR_LABEL" && ! "$PR_LABEL" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.:/-]*$ ]]; then
            echo "Invalid pull-request-label" >&2; exit 1
          fi
          [[ "$CALLER_REPOSITORY" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]
          base_branch=$(gh api "repos/$CALLER_REPOSITORY" --jq .default_branch)
          git check-ref-format "refs/heads/$base_branch"
          base=$(git rev-parse HEAD)
          remote_base=$(git ls-remote --exit-code origin "refs/heads/$base_branch")
          test "$remote_base" = "$base"$'\t'"refs/heads/$base_branch"
          git diff --exit-code
          git diff --cached --exit-code
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"

      - name: Detect package ecosystems in repo root
        id: detect
        run: |
          # .NET is enabled only when root contains at least one .sln/.slnx/.csproj.
          if find . -maxdepth 1 -type f \( -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' \) | grep -q .; then
            echo "update_nuget=true" >> "$GITHUB_OUTPUT"
          else
            echo "No root .sln, .slnx, or .csproj found; skipping .NET setup and NuGet update"
            echo "update_nuget=false" >> "$GITHUB_OUTPUT"
          fi

          # NPM is enabled only when root package.json exists and defines scripts.ci.
          if [ -f "package.json" ]; then
            if jq -e '.scripts.ci | type == "string" and length > 0' package.json >/dev/null; then
              echo "update_npm=true" >> "$GITHUB_OUTPUT"
            else
              echo "Root package.json has no \"ci\" script; skipping Node.js setup and NPM update"
              echo "update_npm=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No root package.json found; skipping Node.js setup and NPM update"
            echo "update_npm=false" >> "$GITHUB_OUTPUT"
          fi

          # Gradle is enabled only when root contains a Gradle wrapper plus a settings/build script.
          if [ -f "gradlew" ] && find . -maxdepth 1 -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' -o -name 'build.gradle.kts' -o -name 'build.gradle' \) | grep -q .; then
            echo "update_gradle=true" >> "$GITHUB_OUTPUT"
          else
            echo "No root gradlew + settings/build.gradle(.kts) found; skipping Java setup and Gradle update"
            echo "update_gradle=false" >> "$GITHUB_OUTPUT"
          fi

          # Mix (Elixir) is enabled when a mix.exs is found a bounded few directories down (Elixir
          # repos in this org keep the actual package nested, e.g. Source/<name>/mix.exs, rather
          # than at the repo root), ignoring dependency/build output directories.
          mix_path=$(find . -maxdepth 3 -type f -name 'mix.exs' -not -path '*/deps/*' -not -path '*/_build/*' | head -1)
          if [ -n "$mix_path" ]; then
            echo "update_mix=true" >> "$GITHUB_OUTPUT"
            echo "mix_dir=$(dirname "$mix_path")" >> "$GITHUB_OUTPUT"
          else
            echo "No mix.exs found; skipping Elixir setup and Mix update"
            echo "update_mix=false" >> "$GITHUB_OUTPUT"
          fi

      # All toolchain setup and dependency-update steps run first, across every detected
      # ecosystem, before any build step runs. A build in one ecosystem can depend on tooling
      # from another (e.g. a .csproj with an MSBuild target that shells out to `yarn build`), so
      # builds must not start until every ecosystem's dependencies are actually in place.
      - name: Setup .NET
        if: steps.detect.outputs.update_nuget == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          # Self-hosted scale-set containers cannot write /usr/share/dotnet, the action's
          # default install location, so callers that pass a self-hosted runs-on label
          # need the runner-scoped location instead (setup-dotnet adds it to PATH).
          # Hosted runners keep their preinstalled SDK path untouched.
          DOTNET_INSTALL_DIR: ${{ runner.environment == 'self-hosted' && format('{0}/dotnet', runner.temp) || '' }}
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        if: steps.detect.outputs.update_npm == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install NPM dependencies
        if: steps.detect.outputs.update_npm == 'true'
        run: yarn install

      - name: Setup Java
        if: steps.detect.outputs.update_gradle == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Elixir
        if: steps.detect.outputs.update_mix == 'true'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Mix dependencies
        if: steps.detect.outputs.update_mix == 'true'
        working-directory: ${{ steps.detect.outputs.mix_dir }}
        run: |
          mix local.hex --force
          mix deps.get

      - name: Update NuGet packages
        if: steps.detect.outputs.update_nuget == 'true'
        run: |
          set +e
          output=$(dotnet package update 2>&1)
          exit_code=$?
          set -e

          echo "$output"

          if [ $exit_code -eq 0 ]; then
            exit 0
          fi

          if [ $exit_code -eq 2 ] && echo "$output" | grep -q "All packages are up to date"; then
            echo "No NuGet updates available; continuing."
            exit 0
          fi

          if [ $exit_code -eq 3 ]; then
            # Exit code 3 has been observed for two distinct cases where the command can't produce
            # an internally consistent result and applies no changes at all: (1) a package with
            # different centrally-managed versions per target framework - e.g. a deliberate
            # multi-TFM override via conditional Directory.Packages.*.props imports - which the
            # command explicitly refuses ("... is not supported by this command"); and (2) a plain
            # NU1109 downgrade conflict, seemingly from the command updating one centrally-pinned
            # package without correctly co-updating another package that's transitively pinned to
            # it (e.g. CentralPackageTransitivePinningEnabled). Neither is actionable here, and
            # since no changes are written to disk in either case, skipping is safe.
            echo "dotnet package update could not produce a consistent result (exit 3); skipping NuGet update for this run."
            exit 0
          fi

          exit $exit_code

      - name: Update NPM packages
        if: steps.detect.outputs.update_npm == 'true'
        run: |
          # typescript is excluded by default: 7.x restructured the published package's internal
          # layout and Yarn Berry's builtin compat/typescript patch hasn't been updated for it yet,
          # so `yarn install` crashes applying the patch. Callers can add repository-specific
          # exclusions while preserving TypeScript in the comma-delimited input, or - preferably,
          # since the bootstrap bot overwrites the caller workflow with the canonical template -
          # list them one-per-line in .github/update-packages-npm-exclusions in the target repo.
          exclusions="$NPM_PACKAGE_EXCLUSIONS"
          exclusions_file=".github/update-packages-npm-exclusions"
          if [ -f "$exclusions_file" ]; then
            file_exclusions=$(paste -sd, "$exclusions_file")
            exclusions="${exclusions:+${exclusions},}${file_exclusions}"
          fi
          npx npm-check-updates -u -w -x "$exclusions"
          yarn install
        env:
          # GitHub Actions sets CI=true, which makes Yarn Berry default to immutable installs and
          # refuse to write the lockfile changes this step exists to produce.
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
          NPM_PACKAGE_EXCLUSIONS: ${{ inputs.npm-package-exclusions }}

      - name: Update Gradle packages
        if: steps.detect.outputs.update_gradle == 'true'
        run: ./gradlew useLatestVersions --no-daemon

      - name: Update Mix packages
        if: steps.detect.outputs.update_mix == 'true'
        working-directory: ${{ steps.detect.outputs.mix_dir }}
        run: mix deps.update --all

      - name: Run post-update command
        if: inputs.post-update-command != ''
        shell: bash
        env:
          POST_UPDATE_COMMAND: ${{ inputs.post-update-command }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$POST_UPDATE_COMMAND"

      - name: Freeze pull request candidate before builds
        id: candidate
        if: inputs.publication-mode == 'pull-request'
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.publication.outputs.base }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          test "$head" = "$EXPECTED_BASE"
          # Only already-tracked updater/hook changes are eligible. New files need
          # a separately reviewed commit first; even explicitly staged additions fail.
          additions=$(git diff --cached --name-only --diff-filter=A --no-renames)
          test -z "$additions"
          git add --update
          if git diff --cached --quiet; then
            echo "No package updates found. Nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update packages"
          parent=$(git rev-parse HEAD^)
          test "$parent" = "$EXPECTED_BASE"
          git diff --exit-code
          git diff --cached --exit-code
          commit=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          {
            echo "commit=$commit"
            echo "tree=$tree"
            echo "changed=true"
          } >> "$GITHUB_OUTPUT"

      - name: Build .NET
        if: steps.detect.outputs.update_nuget == 'true'
        run: dotnet build --configuration Release

      - name: Build NPM
        if: steps.detect.outputs.update_npm == 'true'
        run: yarn ci

      - name: Build Gradle
        if: steps.detect.outputs.update_gradle == 'true'
        run: ./gradlew build --no-daemon

      - name: Build Mix
        if: steps.detect.outputs.update_mix == 'true'
        working-directory: ${{ steps.detect.outputs.mix_dir }}
        run: mix compile

      - name: Publish validated pull request
        if: success() && inputs.publication-mode == 'pull-request' && steps.candidate.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOWS || github.token }}
          CALLER_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ steps.publication.outputs.base_branch }}
          EXPECTED_BASE: ${{ steps.publication.outputs.base }}
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
          CANDIDATE_TREE: ${{ steps.candidate.outputs.tree }}
          PR_LABEL: ${{ inputs.pull-request-label }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$CALLER_REPOSITORY" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]
          [[ -z "$PR_LABEL" || "$PR_LABEL" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.:/-]*$ ]]
          branch="automation/package-update-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git check-ref-format "refs/heads/$branch"
          git check-ref-format "refs/heads/$BASE_BRANCH"
          test "$branch" != "$BASE_BRANCH"

          check_candidate_and_base() {
            head=$(git rev-parse HEAD)
            tree=$(git rev-parse 'HEAD^{tree}')
            parent=$(git rev-parse HEAD^)
            test "$head" = "$CANDIDATE_COMMIT"
            test "$tree" = "$CANDIDATE_TREE"
            test "$parent" = "$EXPECTED_BASE"
            # A build changing tracked files/index invalidates validation. Untracked
            # and ignored build output is never staged or included in the commit.
            git diff --exit-code
            git diff --cached --exit-code
            remote_default=$(gh api "repos/$CALLER_REPOSITORY" --jq .default_branch)
            test "$remote_default" = "$BASE_BRANCH"
            remote_base=$(git ls-remote --exit-code origin "refs/heads/$BASE_BRANCH")
            test "$remote_base" = "$EXPECTED_BASE"$'\t'"refs/heads/$BASE_BRANCH"
          }
          check_remote_candidate() {
            remote_candidate=$(git ls-remote --exit-code origin "refs/heads/$branch")
            test "$remote_candidate" = "$CANDIDATE_COMMIT"$'\t'"refs/heads/$branch"
          }
          check_candidate_and_base
          # Never reuse a branch, including on reruns (which have a new attempt).
          existing_branch=$(git ls-remote origin "refs/heads/$branch")
          test -z "$existing_branch"
          # POST is expected-ABSENT creation, not an update: GitHub rejects an
          # existing ref (422), including one created after the advisory lookup.
          # Never PATCH, force, or retry. A failed response may still have created
          # the ref, and later failures can leave our reservation at the base.
          trap 'status=$?; if [ "$status" -ne 0 ]; then printf "::error::Reservation/publication failed for %s branch %s; a branch (possibly base-only) or PR may remain. Inspect ownership before manual recovery; no automatic cleanup or retry.\n" "$CALLER_REPOSITORY" "$branch" >&2; fi' EXIT
          reserved_ref=$(gh api --method POST "repos/$CALLER_REPOSITORY/git/refs" \
            -f "ref=refs/heads/$branch" -f "sha=$EXPECTED_BASE" \
            --jq '[.ref, .object.sha, .object.type] | @tsv')
          expected_ref="refs/heads/$branch"$'\t'"$EXPECTED_BASE"$'\tcommit'
          test "$reserved_ref" = "$expected_ref"
          # Successful exclusive creation plus API/Git readbacks establishes our
          # reservation before a normal, nonforce push of the tested commit.
          owned_ref=$(gh api "repos/$CALLER_REPOSITORY/git/ref/heads/$branch" \
            --jq '[.ref, .object.sha, .object.type] | @tsv')
          test "$owned_ref" = "$expected_ref"
          remote_owned=$(git ls-remote --exit-code origin "refs/heads/$branch")
          test "$remote_owned" = "$EXPECTED_BASE"$'\t'"refs/heads/$branch"
          check_candidate_and_base
          git push origin "$CANDIDATE_COMMIT:refs/heads/$branch"
          check_remote_candidate
          check_candidate_and_base

          # Explicit head/base avoids gh's interactive branch push/fork behavior.
          # No draft, auto-merge, implicit release label, or retry on API failure.
          pr_args=(--repo "$CALLER_REPOSITORY" --base "$BASE_BRANCH"
            --head "$branch" --title "chore: update packages"
            --body $'## Changed\n\n- Update dependency versions and required runtime compatibility settings.')
          if [ -n "$PR_LABEL" ]; then pr_args+=(--label "$PR_LABEL"); fi
          pr_url=$(gh pr create "${pr_args[@]}")
          check_remote_candidate
          check_candidate_and_base
          pr_refs=$(gh pr view "$pr_url" --repo "$CALLER_REPOSITORY" \
            --json headRefOid,baseRefOid,headRefName,baseRefName \
            --jq '[.headRefOid, .baseRefOid, .headRefName, .baseRefName] | @tsv')
          test "$pr_refs" = "$CANDIDATE_COMMIT"$'\t'"$EXPECTED_BASE"$'\t'"$branch"$'\t'"$BASE_BRANCH"
          echo "$pr_url"

      - name: Commit and push changes
        if: inputs.publication-mode == 'direct'
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOWS || github.token }}
        run: |
          # Check if there are any changes
          if git diff --quiet && git diff --cached --quiet; then
            echo "No package updates found. Nothing to commit."
            exit 0
          fi

          # Configure git identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Build commit message from what was updated
          updated_types=""
          if [ "${{ steps.detect.outputs.update_nuget }}" == "true" ]; then
            updated_types="NuGet"
          fi
          if [ "${{ steps.detect.outputs.update_npm }}" == "true" ]; then
            if [ -n "$updated_types" ]; then
              updated_types="$updated_types and NPM"
            else
              updated_types="NPM"
            fi
          fi
          if [ "${{ steps.detect.outputs.update_gradle }}" == "true" ]; then
            if [ -n "$updated_types" ]; then
              updated_types="$updated_types and Gradle"
            else
              updated_types="Gradle"
            fi
          fi
          if [ "${{ steps.detect.outputs.update_mix }}" == "true" ]; then
            if [ -n "$updated_types" ]; then
              updated_types="$updated_types and Mix"
            else
              updated_types="Mix"
            fi
          fi

          git add -A
          git commit -m "chore: update ${updated_types} packages"

          # The default branch can move between checkout and push - especially while
          # many repositories run this workflow around the same time. A plain push then
          # fails with a non-fast-forward rejection, losing the whole update run. Rebase
          # the update commit onto the current tip and retry a bounded number of times;
          # the CI that runs on the pushed commit remains the safety net for the merged
          # result.
          branch=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/3); rebasing onto latest ${branch} and retrying."
            git pull --rebase origin "${branch}"
          done
          git push origin HEAD
