name: Verify Discoverability Check

on:
  pull_request:
    paths:
      - .github/scripts/verify-discoverability.mjs
      - .github/workflows/verify-discoverability.yml
      - .github/workflows/verify-discoverability-check.yml
      - .github/scripts/tests/verify-discoverability.test.py
      - .github/scripts/tests/fixtures/discoverability/**
      - README.md
  push:
    branches: [main]
    paths:
      - .github/scripts/verify-discoverability.mjs
      - .github/workflows/verify-discoverability.yml
      - .github/workflows/verify-discoverability-check.yml
      - .github/scripts/tests/verify-discoverability.test.py
      - .github/scripts/tests/fixtures/discoverability/**
      - README.md

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out workflow and offline tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check script syntax
        run: node --check .github/scripts/verify-discoverability.mjs
      - name: Exercise the checker on the good and bad fixture sites and the pinned caller
        # Fixture sites only; no network contact.
        run: python3 -B .github/scripts/tests/verify-discoverability.test.py
