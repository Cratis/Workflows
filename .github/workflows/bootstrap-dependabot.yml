name: Bootstrap Dependabot
# Manual, single-file rollout. Merging this workflow NEVER starts an organization-wide write.
# Appends monthly grouped github-actions updates without replacing existing ecosystems or comments.
# PAT_WORKFLOWS needs Contents: Read/write and ruleset bypass for direct default-branch pushes.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List changes without writing to repositories
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: bootstrap-dependabot
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify PAT can authenticate
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOWS }}
        run: |
          auth_error=$(mktemp)
          if ! gh api /user >/dev/null 2>"$auth_error"; then
            echo "::error::Could not authenticate with PAT_WORKFLOWS. Is the secret set correctly?"
            echo "::error::API error: $(cat "$auth_error")"
            rm -f "$auth_error"
            exit 1
          fi
          rm -f "$auth_error"
          login=$(gh api /user --jq '.login')
          echo "✓ Authenticated as $login"

      - name: Get non-archived Cratis repositories
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOWS }}
        run: |
          gh repo list Cratis --limit 1000 --json name,isArchived \
            --jq '[.[] | select(.isArchived == false) | .name]' \
            > "$GITHUB_WORKSPACE/repos.json"

      - name: Bootstrap Dependabot configuration
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOWS }}
          REPOS_FILE: ${{ github.workspace }}/repos.json
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash .github/scripts/bootstrap-dependabot.sh
