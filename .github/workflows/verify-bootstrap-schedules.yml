name: Verify Bootstrap Schedules

on:
  pull_request:
    paths:
      - .github/scripts/tests/bootstrap-schedules.test.py
      - .github/scripts/bootstrap-common-workflows.sh
      - .github/workflows/verify-bootstrap-schedules.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/tests/bootstrap-schedules.test.py
      - .github/scripts/bootstrap-common-workflows.sh
      - .github/workflows/verify-bootstrap-schedules.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify deterministic weekly package-update schedules
        run: python3 .github/scripts/tests/bootstrap-schedules.test.py
