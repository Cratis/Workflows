name: Verify Docker Cleanup

# Fails on Docker cleanup that is not scoped to a run: `docker ... prune` or a bulk `docker rm`, `kill`
# or `stop` fed by a listing, without a `--filter label=...` (Cratis/Workflows#166). Pull requests and
# pushes test the checker offline against its fixtures. The weekly sweep scans every non-archived Cratis
# repository. Other repositories call this workflow to gate their own checkout.
on:
  pull_request:
    paths:
      - .github/scripts/verify-docker-cleanup.py
      - .github/scripts/tests/verify-docker-cleanup.test.py
      - .github/scripts/tests/fixtures/docker-cleanup/**
      - .github/workflows/verify-docker-cleanup.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/verify-docker-cleanup.py
      - .github/scripts/tests/verify-docker-cleanup.test.py
      - .github/scripts/tests/fixtures/docker-cleanup/**
      - .github/workflows/verify-docker-cleanup.yml
  schedule:
    - cron: "23 5 * * 3"
  workflow_dispatch:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the gate job
        type: string
        default: ubuntu-latest

permissions:
  contents: read

# The sweep has its own group so a push to main never cancels a running organization sweep.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'sweep' || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the checker against its fixtures
        run: python3 -B .github/scripts/tests/verify-docker-cleanup.test.py
      - name: Prove the checker still finds planted violations
        run: python3 -B .github/scripts/verify-docker-cleanup.py --self-test

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every Cratis repository
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOWS }}
        run: python3 -B .github/scripts/verify-docker-cleanup.py --org

  gate:
    if: github.event_name == 'workflow_call'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Cratis/Workflows
          path: .cratis-workflows
          persist-credentials: false
      - name: Fail on unscoped Docker cleanup
        env:
          REPOSITORY: ${{ github.event.repository.name }}
        run: python3 -B .cratis-workflows/.github/scripts/verify-docker-cleanup.py --root . --repo "$REPOSITORY" --exclude .cratis-workflows
