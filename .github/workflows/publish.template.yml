# Template for publish workflow with auto-approve support
# 
# This template shows how to use the auto-approve-publish-deployments workflow
# to automatically approve pending npm and nuget deployments.
#
# To use this template in your repository:
# 1. Copy the relevant sections from this file to your publish.yml
# 2. Ensure you have the auto-approve-deployments job that calls the reusable workflow
# 3. The auto-approve job should run after your package publishing jobs complete

name: Publish

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NUGET_OUTPUT: ./Artifacts/NuGet
  DOTNET8_VERSION: "8.0.407"
  DOTNET9_VERSION: "9.0.x"
  DOTNET10_VERSION: "10.0.x"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  pull_request:
    types: [closed]
    branches:
      - "**"
    paths:
      - "Source/**"

permissions:
  contents: write
  deployments: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  publish-dotnet-packages:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      # Required for NuGet trusted publishing using OIDC tokens
      id-token: write

    steps:
      # ... publish dotnet packages ...

  publish-npm-packages:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
      id-token: write

    steps:
      # ... publish npm packages ...

  # ⬇️ ADD THIS JOB TO APPROVE PENDING DEPLOYMENTS ⬇️
  auto-approve-deployments:
    name: Auto-Approve Pending Deployments
    needs: [publish-dotnet-packages, publish-npm-packages]
    # Only run if package publishing jobs completed successfully
    if: needs.publish-dotnet-packages.result == 'success' && needs.publish-npm-packages.result == 'success'
    uses: Cratis/Workflows/.github/workflows/auto-approve-publish-deployments.yml@main
    with:
      workflow_run_id: ${{ github.run_id }}
