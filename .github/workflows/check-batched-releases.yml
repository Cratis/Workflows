name: Check Batched Releases

# Pull requests and pushes run the offline tests. The hourly sweep fails when a repository that releases
# in batches (release-window on its release step) has releasable merges waiting longer than the window
# plus 60 minutes, which means its GitHub cron was skipped or lagged (Cratis/Workflows#189).
on:
  pull_request:
    paths:
      - .github/scripts/check-batched-releases.py
      - .github/scripts/batched-release-cron.sh
      - .github/scripts/tests/batched-releases.test.py
      - .github/templates/publish.template.yml
      - .github/workflows/check-batched-releases.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/check-batched-releases.py
      - .github/scripts/batched-release-cron.sh
      - .github/scripts/tests/batched-releases.test.py
      - .github/templates/publish.template.yml
      - .github/workflows/check-batched-releases.yml
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# The sweep has its own group so a push to main never cancels a running organization sweep.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'sweep' || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the template opt-in, the cron helper and the staleness decision
        run: python3 -B .github/scripts/tests/batched-releases.test.py
      - name: Prove the check still finds a planted stale repository
        run: python3 -B .github/scripts/check-batched-releases.py --self-test

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every batched-release repository
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOWS }}
        run: python3 -B .github/scripts/check-batched-releases.py
