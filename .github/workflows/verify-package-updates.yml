name: Verify Package Updates

on:
  pull_request:
    paths:
      - .github/workflows/update-packages.yml
      - .github/workflows/bootstrap-common-workflows.yml
      - .github/workflows/verify-package-updates.yml
      - .github/scripts/tests/update-packages.test.py
      - .github/scripts/tests/bootstrap-package-update-safety.test.py
      - .github/scripts/sync-package-update-peers.py
      - .github/scripts/tests/sync-package-update-peers.test.py
      - .github/scripts/tests/fixtures/package-update-peers/**
  push:
    branches: [main]
    paths:
      - .github/workflows/update-packages.yml
      - .github/workflows/bootstrap-common-workflows.yml
      - .github/workflows/verify-package-updates.yml
      - .github/scripts/tests/update-packages.test.py
      - .github/scripts/tests/bootstrap-package-update-safety.test.py
      - .github/scripts/sync-package-update-peers.py
      - .github/scripts/tests/sync-package-update-peers.test.py
      - .github/scripts/tests/fixtures/package-update-peers/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out workflow and offline tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify package-update rollout cannot trigger organization-wide writes
        env:
          PACKAGE_UPDATE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/tests/bootstrap-package-update-safety.test.py
      - name: Exercise inline shell with local Git and stub toolchains
        # No live package updates, GitHub token, gh calls, or dependency installation.
        run: python3 .github/scripts/tests/update-packages.test.py
      - name: Set up the same Node.js version as package updates
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify peer compatibility ranges on real manifests
        run: python3 .github/scripts/tests/sync-package-update-peers.test.py
