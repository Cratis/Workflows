name: Auto-Approve Publish Deployments
# Reusable workflow that approves pending environment deployments (npm/nuget)
# for a workflow run, intended for trusted publishing flows.

on:
  workflow_call:
    inputs:
      workflow_run_id:
        description: Workflow run id to approve pending deployments for
        required: true
        type: number

permissions:
  actions: read
  deployments: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve pending npm/nuget deployments
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
        run: |
          set -euo pipefail

          mapfile -t env_ids < <(
            gh api "repos/${{ github.repository }}/actions/runs/${WORKFLOW_RUN_ID}/pending_deployments" \
              --jq '.[] | select(.environment.name == "npm" or .environment.name == "nuget") | .environment.id' |
              sort -u
          )

          if [ "${#env_ids[@]}" -eq 0 ]; then
            echo "No pending npm/nuget deployments found for run ${WORKFLOW_RUN_ID}"
            exit 0
          fi

          args=()
          for env_id in "${env_ids[@]}"; do
            args+=(-F "environment_ids[]=${env_id}")
          done

          gh api -X POST "repos/${{ github.repository }}/actions/runs/${WORKFLOW_RUN_ID}/pending_deployments" \
            "${args[@]}" \
            -f state=approved \
            -f comment='Auto-approved for trusted publishing'

          echo "Approved pending deployments for environments: ${env_ids[*]}"
