name: Verify Release Notes Program

on:
  pull_request:
    paths:
      - .github/workflows/verify-release-notes.yml
      - .github/workflows/verify-release-notes-program.yml
      - .github/scripts/tests/verify-release-notes.spec.mjs
      - .github/scripts/tests/fixtures/release-notes/**
      - .github/pull_request_template.md
      - .github/scripts/bootstrap-common-workflows.sh
      - .github/workflows/bootstrap-common-workflows.yml
      - .github/workflows/verify-release-intent.yml
      - .github/workflows/normalize-dependabot-labels.yml
      - .github/scripts/tests/verify-release-intent.spec.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-release-notes.yml
      - .github/workflows/verify-release-notes-program.yml
      - .github/scripts/tests/verify-release-notes.spec.mjs
      - .github/scripts/tests/fixtures/release-notes/**
      - .github/pull_request_template.md
      - .github/scripts/bootstrap-common-workflows.sh
      - .github/workflows/bootstrap-common-workflows.yml
      - .github/workflows/verify-release-intent.yml
      - .github/workflows/normalize-dependabot-labels.yml
      - .github/scripts/tests/verify-release-intent.spec.mjs

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out workflow and offline tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Exercise the actual inline program against real release bodies
        # No token, no GitHub API calls, no dependency installation.
        run: node --test .github/scripts/tests/verify-release-notes.spec.mjs
      - name: Exercise the release-intent gate and the Dependabot label normalizer
        # bash, jq and a stub gh; no token and no GitHub API calls.
        run: node --test .github/scripts/tests/verify-release-intent.spec.mjs
