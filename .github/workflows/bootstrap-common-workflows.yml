name: Bootstrap Common Workflows
# Ensures all Cratis repositories have the standard set of common wrapper
# workflows installed and up-to-date.  Currently bootstraps:
#
#   • cleanup-pr-artifacts.yml            — deletes GitHub Packages published during a PR
#   • update-packages.yml                 — weekly NuGet + NPM package updates
#   • auto-approve-publish-deployments.yml — approves npm/nuget trusted publishing deployments
#   • verify-no-work-records.yml           — fails PRs that track AI session work records
#   • verify-release-notes.yml             — fails release-bound PRs whose description breaks the release-note contract
#   • .github/codeql/codeql-config.yml     — shared CodeQL query filters
#
# Handles both initial bootstrap (new repos) and ongoing updates:
#   • New repos:            adds missing wrapper workflows
#   • Already-bootstrapped: updates wrappers if content has changed
#   • Already up-to-date:   skips processing
#
# Triggered automatically on push to main when the watched workflows, CodeQL
# config or bootstrap script change. Package-update implementation changes do
# not change the canonical wrapper and must not trigger organization-wide writes.
# Can also be run manually via workflow_dispatch.
#
# Requires PAT_WORKFLOWS secret with permissions:
#   Classic PAT:       repo + workflow scopes
#   Fine-grained PAT:  Contents (read/write) + Workflows (read/write)
#
# The PAT owner must also be configured as a bypass actor on each target
# repository's branch protection ruleset so that direct pushes to the
# default branch are permitted.

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-pr-artifacts.yml"
      - ".github/workflows/auto-approve-publish-deployments.yml"
      - ".github/codeql/codeql-config.yml"
      - ".github/scripts/bootstrap-common-workflows.sh"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Repositories to skip when bootstrapping.
  # Workflows  - this repo; it holds the reusable workflows themselves
  # cratis.github.io, StudioIssues - do not publish GitHub Packages
  # Chronicle.Dapr - its own publication-boundary governance (tools/verify-workflow-boundary.py)
  #   declares exactly build, preview-publish, and the pinned verify-no-work-records;
  #   the bootstrap's wrappers and wrapper rewrites violate it
  # Chronicle.Wolverine - its reviewed workflow composition (test_reviewed_workflow_composition.py)
  #   requires full-SHA pins, the declared secret only, extra-allowed VERSIONS, and the
  #   manual reviewed-update path; the bootstrap's @main rewrites violate it
  # Stage - owns its reviewed package-update/kernel guard workflow and pin;
  #   bootstrap must not overwrite it
  # Studio, Direct, Ensemble, Infrastructure, Experiments - private repositories with no GitHub-hosted
  #   Actions budget: their verify-no-work-records, update-packages and auto-approve-publish-deployments
  #   wrappers deliberately run on cratis-arc (`runs-on: cratis-arc`, `${{ vars.RUNNER_GATE || 'cratis-arc' }}`
  #   or, in Ensemble, `${{ vars.ENSEMBLE_RUNNER || 'cratis-arc' }}`), so overwriting them with the canonical
  #   ubuntu-latest wrappers would fail their jobs; Studio and Direct also removed cleanup-pr-artifacts on purpose
  # Strategy - private, and deliberately removed its cleanup-pr-artifacts, update-packages and
  #   auto-approve-publish-deployments workflows (2026-09-27); its verify-no-work-records runs on cratis-arc
  # Identity - private and new: the canonical wrappers run on ubuntu-latest, which has no budget there
  # Ante, Chronicle.Elixir, Components, Orleans - public repositories with a deliberately customized
  #   update-packages.yml (staggered cron, pull-request publication mode, paused schedule, post-update command)
  # AI.Distribution - no longer in use; its branch protection also rejects direct pushes
  # Arc.TypeScript, Chronicle.Python, Eventmodelers-Build-Kit-Java, Eventmodelers-Build-Kit-Kotlin - never
  #   bootstrapped (the bootstrap has failed since 2026-08-25), so a run would also install every standard
  #   wrapper there for the first time; held back until that is decided, and they install
  #   verify-release-notes.yml through their own reviewed change meanwhile
  # The ignored private and customized repositories install verify-release-notes.yml through their own
  #   reviewed change, copying the caller with their own runner fallback in its `runs-on` input (RUNNER_GATE is
  #   only an outage escape hatch, normally unset; Ensemble uses vars.ENSEMBLE_RUNNER)
  REPOS_TO_IGNORE: '["Workflows","cratis.github.io","StudioIssues","Documentation","cratis.studio","Automation",".github","Dockerfiles","AI","Templates","Dockerfiles","release-action","Chronicle.Dapr","Chronicle.Wolverine","Stage","Studio","Direct","Ensemble","Infrastructure","Experiments","Strategy","Identity","Ante","Chronicle.Elixir","Components","Orleans","AI.Distribution","Arc.TypeScript","Chronicle.Python","Eventmodelers-Build-Kit-Java","Eventmodelers-Build-Kit-Kotlin","Chronicle.Go","Arc.Go"]'

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify PAT can authenticate
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOWS }}
        run: |
          auth_error=$(mktemp)
          if ! gh api /user >/dev/null 2>"$auth_error"; then
            echo "::error::Could not authenticate with PAT_WORKFLOWS. Is the secret set correctly?"
            echo "::error::API error: $(cat "$auth_error")"
            rm -f "$auth_error"
            exit 1
          fi
          rm -f "$auth_error"
          login=$(gh api /user --jq '.login')
          echo "✓ Authenticated as $login"
          echo "  gh auth status:"
          gh auth status 2>&1 | sed 's/^/    /'
          oauth_scopes=$(gh api /user -i 2>/dev/null | grep -i '^x-oauth-scopes:' | sed 's/[^:]*: //' | tr -d '\r' || true)
          if [ -n "$oauth_scopes" ]; then
            echo "  PAT type: classic"
            echo "  OAuth scopes: $oauth_scopes"
          else
            echo "  PAT type: fine-grained (scopes not exposed via API)"
          fi

      - name: Get all Cratis repositories
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOWS }}
        run: |
          gh repo list Cratis --limit 1000 --json name,isArchived \
            --jq '[.[] | select(.isArchived == false) | .name]' \
            > "$GITHUB_WORKSPACE/repos.json"

      - name: Bootstrap common workflows in all repositories
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOWS }}
          REPOS_FILE: ${{ github.workspace }}/repos.json
          REPOS_IGNORE: ${{ env.REPOS_TO_IGNORE }}
        run: |
          bash .github/scripts/bootstrap-common-workflows.sh
