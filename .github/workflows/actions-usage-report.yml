name: Actions Usage Report

# Weekly guardrail against runaway hosted consumption and scale-set queue pressure.
# Job-level data separates self-hosted execution from estimated private billing.
on:
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: actions-usage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # Live no-issue collection measured 481s at the 480s collection bound.
    # Allow one final 60s API call plus checkout/publication overhead.
    timeout-minutes: 12
    steps:
      - name: Check out the reporting script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish the report
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOWS }}
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/actions-usage-report.md"
          python3 .github/scripts/actions-usage-report.py > "$report"
          title="Actions usage report ($(date -u +%Y-%m-%d))"
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "$title" --body-file "$report"
