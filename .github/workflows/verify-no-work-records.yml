name: Verify No Work Records

# Reusable guard for the caller's tracked files. The script is fetched at an
# immutable Workflows commit because checkout below contains the caller's repo,
# not this repository. Update the script pin whenever the script changes.
# Exit codes: 0 clean, 1 violations, 2 could not run.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label the guard job runs on. Callers in private repositories
          should pass their self-hosted scale-set label (for example cratis-arc)
          so the guard does not consume billed GitHub-hosted minutes.
        type: string
        required: false
        default: ubuntu-latest
      extra-allowed:
        description: Comma-separated additional allowed root-level markdown file names (with or without .md)
        required: false
        type: string
        default: ""
      extra-allowed-paths:
        description: Comma-separated additional documentation directory prefixes (for example governance/,evidence/) whose work-record-style file names are allowed
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify no AI work records are tracked
        env:
          EXTRA_ALLOWED: ${{ inputs.extra-allowed }}
          EXTRA_ALLOWED_PATHS: ${{ inputs.extra-allowed-paths }}
        run: |
          set -euo pipefail
          if ! command -v curl >/dev/null || ! command -v node >/dev/null; then
            echo 'could not run: curl and node are required' >&2
            exit 2
          fi
          script="$RUNNER_TEMP/verify-no-work-records.mjs"
          if ! curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 \
            'https://raw.githubusercontent.com/Cratis/Workflows/854264789b977e26455a868b66e6b5b6f5c3abb6/.github/scripts/verify-no-work-records.mjs' \
            --output "$script"; then
            echo 'could not run: downloading the pinned work-record guard failed' >&2
            exit 2
          fi
          node "$script"
