name: Propagate PR and Issue Templates
# Propagates the Pull Request and Issue templates from this repository
# (Cratis/Workflows) to all other repositories in the Cratis organization
# by pushing a commit directly to each target repository's default branch
# (no PR).
#
# This workflow requires PAT_WORKFLOWS secret with permissions:
#   Classic PAT:       repo scope
#   Fine-grained PAT:  Contents (read/write) + Metadata (read)
#
# The PAT owner must also be configured as a bypass actor on each target
# repository's branch protection ruleset so that direct pushes to the
# default branch are permitted.  See the README for setup instructions.
#
# NOTE: This workflow uses the GitHub Git Data API (blobs/trees/commits/refs)
# directly — no per-repository workflow dispatch is needed.
#
# Repositories are processed in parallel using a dynamic matrix built from the
# list of non-archived Cratis repositories (excluding this repo and a small
# ignore list).  Each matrix job handles exactly one target repository.

on:
  push:
    branches: ["main"]
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:

env:
  # Repositories to skip when propagating templates.
  # Historically matched the retired Copilot-sync exceptions; kept as the template-propagation exceptions.
  # The workflow pushes the template straight to the default branch of every other repository whose
  # .github/pull_request_template.md differs, so a repository that deliberately customized its template
  # (content beyond any version of the org template) must be listed here, or the push silently replaces it:
  # Arc, Scene - the org template with the issue-reference line sharpened (never leave `(#123)`
  #   or `(#issue)` as a placeholder)
  # Arc.Kotlin, Chronicle, Chronicle.Kotlin - the org template with user-facing-impact guidance and optional
  #   issue references
  # Chronicle.Wolverine, Screenplay, Screenplay.CritterStack, Screenplay.Generation, Studio - the org
  #   template with the placeholder bullets stripped of `(#123)` and the "leave bullets without issue
  #   references by default" rule
  # Arc.TypeScript - Arc's release-intent template: copyright header, breaking/major parity policy that
  #   needs a human merge, its own section names
  # Chronicle.Dapr - private incubation template: classification (DEC-0025..DEC-0030), purpose, work package
  #   and release-impact checklist
  # Chronicle.Python - the org sections plus a Verification checklist (ruff, mypy, pytest)
  # Strategy - private governance template: confidential classification, linked work, release-impact
  #   classification
  # Prompter, Synopsis - their own layout: a Summary with `###` sections (Prompter), a shortened preamble
  #   and bullets without issue references (Synopsis)
  # Chronicle.Go, Arc.Go, Fundamentals.Go - Go language ports with their own issue labels and a lint-clean pull request template
  # AI.Distribution - no longer in use; its branch protection also rejects direct pushes
  # Ignoring a repository skips it entirely, so the repositories above also stop receiving updates to
  # .github/ISSUE_TEMPLATE/**; change their issue templates in their own repositories.
  # .github is Cratis/.github, the organization default template shown in repositories without their own;
  # keep it in step with this template by a pull request there.
  REPOS_TO_IGNORE: '["Workflows","cratis.github.io","StudioIssues","Dockerfiles",".github","StudioIssues","cratis.studio","Arc","Arc.Kotlin","Arc.TypeScript","Chronicle","Chronicle.Dapr","Chronicle.Kotlin","Chronicle.Python","Chronicle.Wolverine","Prompter","Scene","Screenplay","Screenplay.CritterStack","Screenplay.Generation","Strategy","Studio","Synopsis","AI.Distribution","Chronicle.Go","Arc.Go","Fundamentals.Go"]'

permissions:
  contents: read

jobs:
  get-repos:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Cratis' }}
    outputs:
      repos: ${{ steps.list-repos.outputs.repos }}

    steps:
      - name: Get all Cratis repositories
        id: list-repos
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOWS }}
        run: |
          # List all non-archived repos, excluding this repo and the repos in
          # REPOS_TO_IGNORE.  The result is a compact JSON array used as the
          # matrix.
          repos=$(gh repo list Cratis --limit 1000 --json name,isArchived \
            | jq -c --argjson ignore "$REPOS_TO_IGNORE" \
            '[.[] | select(.isArchived == false) | .name
              | select(. as $n | ($ignore | index($n)) == null)]')
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

  propagate:
    needs: get-repos
    if: ${{ needs.get-repos.outputs.repos != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.get-repos.outputs.repos) }}
      fail-fast: false

    steps:
      - name: Checkout Workflows repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PAT_WORKFLOWS }}

      - name: Propagate PR and Issue templates to ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOWS }}
          TARGET_REPO: ${{ matrix.repo }}
        run: |
          bash .github/scripts/propagate-pr-templates.sh
