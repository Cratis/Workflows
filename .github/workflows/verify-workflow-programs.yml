name: Verify Workflow Programs

on:
  pull_request:
    paths:
      - .github/scripts/verify-no-work-records.mjs
      - .github/workflows/verify-no-work-records.yml
      - .github/scripts/tests/verify-no-work-records.test.py
      - .github/workflows/cleanup-pr-artifacts.yml
      - .github/scripts/tests/cleanup-pr-artifacts.test.py
      - ".github/scripts/update-ai-profile-subscription*.mjs"
      - .github/workflows/update-ai-profile-subscription.yml
      - .github/workflows/verify-workflow-programs.yml
      - README.md
  push:
    branches: [main]
    paths:
      - .github/scripts/verify-no-work-records.mjs
      - .github/workflows/verify-no-work-records.yml
      - .github/scripts/tests/verify-no-work-records.test.py
      - .github/workflows/cleanup-pr-artifacts.yml
      - .github/scripts/tests/cleanup-pr-artifacts.test.py
      - ".github/scripts/update-ai-profile-subscription*.mjs"
      - .github/workflows/update-ai-profile-subscription.yml
      - .github/workflows/verify-workflow-programs.yml
      - README.md

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out workflow and offline tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check guard syntax
        run: node --check .github/scripts/verify-no-work-records.mjs
      - name: Exercise the extracted guard and pinned caller
        # Fixture repositories only; no GitHub contact. Includes --self-test and its red control.
        run: python3 -B .github/scripts/tests/verify-no-work-records.test.py
      - name: Exercise the actual inline program with an in-memory API
        # No package token, live cleanup invocation, or dependency installation.
        run: python3 .github/scripts/tests/cleanup-pr-artifacts.test.py
      - name: Verify controller syntax
        run: |
          set -euo pipefail
          node --check .github/scripts/update-ai-profile-subscription.mjs
      - name: Verify controller behavior
        run: |
          set -euo pipefail
          node --test .github/scripts/update-ai-profile-subscription*.spec.mjs
