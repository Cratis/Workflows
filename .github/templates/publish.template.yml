# Template for publish workflow
# 
# The auto-approve-publish-deployments workflow will automatically watch for
# this workflow completing and approve any pending npm/nuget deployments.
# No additional configuration is needed in your publish.yml.

name: Publish

# Never cancel or drop a release. cratis/release-action releases one merged pull request per run, and
# GitHub's default concurrency keeps a single pending run per group and cancels any older pending one,
# so merges in quick succession would lose releases. `queue: max` keeps up to 100 pending runs and starts
# them in order. Leave `cancel-in-progress` out: a cancelled half-publish is worse than a queued one, and
# GitHub rejects `queue: max` combined with it. A pull request closed without merging releases nothing,
# so it gets a group of its own and never takes a place in front of a real release.
concurrency:
  group: ${{ (github.event_name != 'pull_request' || github.event.pull_request.merged == true) && format('publish-{0}', github.repository) || format('publish-unmerged-{0}', github.run_id) }}
  queue: max

env:
  NUGET_OUTPUT: ./Artifacts/NuGet
  DOTNET8_VERSION: "8.0.407"
  DOTNET9_VERSION: "9.0.x"
  DOTNET10_VERSION: "10.0.x"

on:
  workflow_dispatch:
    inputs:
      version:
        # Leave empty to work the version out from the merged pull request. Set a real version only to force
        # a manual release - the action never releases from an empty or '0.0.0' value.
        description: 'Version to release (leave empty to derive it from the pull request)'
        required: false
        default: ''
        type: string
      release-notes:
        description: 'Release notes (leave empty for GitHub-generated notes)'
        required: false
        default: ''
        type: string
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  pull_request:
    types: [closed]
    branches:
      - "**"
    paths:
      - "Source/**"

permissions:
  issues: write
  contents: write
  deployments: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  publish-dotnet-packages:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      # Required for NuGet trusted publishing using OIDC tokens
      id-token: write

    steps:
      # ... publish dotnet packages ...

  publish-npm-packages:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
      id-token: write

    steps:
      # ... publish npm packages ...

