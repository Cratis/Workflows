name: Unsafe security audit control
on: pull_request
permissions:
  contents: read
jobs:
  unsafe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: docker/login-action@v3
      - run: echo ${{ github.event.pull_request.title }}
