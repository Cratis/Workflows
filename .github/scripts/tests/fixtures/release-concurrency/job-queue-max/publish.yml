name: Publish

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: echo wait for build

  release:
    needs: [verify-build]
    concurrency:
      group: publish-release-${{ github.ref }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: echo release
