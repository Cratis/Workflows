name: Publish

# The workflow-level group is shared and applies first, so it drops pending runs before the job queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]

jobs:
  release:
    concurrency:
      group: publish-release-${{ github.ref }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: echo release
